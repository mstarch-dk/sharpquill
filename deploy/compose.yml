# Generic single-site production stack built from published images.
#
#   cp .env.example .env     # then edit: domains, secrets, image version
#   docker compose up -d                       # app only, bring your own reverse proxy
#   docker compose --profile caddy up -d       # app + bundled Caddy (HTTPS, see Caddyfile.example)
#
# See docs/deployment.md for the full walkthrough.
name: ${COMPOSE_PROJECT_NAME:-cms}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms_user} -d ${POSTGRES_DB:-cms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs EF Core migrations and creates the first admin while the authors table is empty
  db-init:
    image: ${SHARPQUILL_IMAGE_PREFIX:?Set SHARPQUILL_IMAGE_PREFIX in .env}/sharpquill-db-init:${SHARPQUILL_VERSION:?Set SHARPQUILL_VERSION in .env (a release such as 1.2.3, or sha-<short>)}
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB:-cms};Username=${POSTGRES_USER:-cms_user};Password=${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${SHARPQUILL_IMAGE_PREFIX}/sharpquill-api:${SHARPQUILL_VERSION:?Set SHARPQUILL_VERSION in .env (a release such as 1.2.3, or sha-<short>)}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB:-cms};Username=${POSTGRES_USER:-cms_user};Password=${POSTGRES_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      Jwt__Issuer: https://${DOMAIN:?Set DOMAIN in .env}
      Jwt__Audience: https://${DOMAIN}
      # Browser origins allowed by CORS: admin API calls only from the admin host, everything else from the public host
      Cors__AdminOrigins__0: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
      Cors__PublicOrigins__0: https://${DOMAIN}
      Email__Host: ${EMAIL_HOST:-}
      Email__Port: ${EMAIL_PORT:-587}
      Email__Username: ${EMAIL_USERNAME:-}
      Email__Password: ${EMAIL_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM_ADDRESS:-}
      Email__FromName: ${EMAIL_FROM_NAME:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  web:
    image: ${SHARPQUILL_IMAGE_PREFIX}/sharpquill-web:${SHARPQUILL_VERSION:?Set SHARPQUILL_VERSION in .env (a release such as 1.2.3, or sha-<short>)}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      # Browser requests use the public URL, SSR requests stay inside the Docker network
      NUXT_PUBLIC_API_BASE: https://${DOMAIN}
      NUXT_API_BASE_INTERNAL: http://api:5000
      NUXT_PUBLIC_UMAMI_HOST: ${UMAMI_HOST:-https://${DOMAIN}/umami}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      - api

  admin:
    image: ${SHARPQUILL_IMAGE_PREFIX}/sharpquill-admin:${SHARPQUILL_VERSION:?Set SHARPQUILL_VERSION in .env (a release such as 1.2.3, or sha-<short>)}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3000"
    environment:
      # Empty: the admin app calls the API on its own hostname, which the proxy routes to the API
      NUXT_PUBLIC_API_BASE: ""
      NUXT_UPLOADS_PROXY: http://api:5000
    depends_on:
      - api

  umami-db-init:
    image: postgres:17
    entrypoint: >
      sh -c "psql -h db -U ${POSTGRES_USER:-cms_user} -d ${POSTGRES_DB:-cms} -tc
      \"SELECT 1 FROM pg_database WHERE datname = 'umami'\" |
      grep -q 1 || psql -h db -U ${POSTGRES_USER:-cms_user} -d ${POSTGRES_DB:-cms} -c 'CREATE DATABASE umami OWNER ${POSTGRES_USER:-cms_user}'"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:${UMAMI_VERSION:-3.5.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3002}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cms_user}:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
      umami-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional TLS-terminating reverse proxy. Skip it if you already run a proxy on the host
  # (point it at the 127.0.0.1 ports above instead).
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ANALYTICS_DOMAIN: ${ANALYTICS_DOMAIN:-analytics.localhost}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Optional: CA certificate for admin mTLS (see Caddyfile)
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin
      - api
      - umami

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
