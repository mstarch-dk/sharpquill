# body: Markdown. layout: sections of blocks (the container editor); image blocks name a generated image.
articles:
  - slug: planlaeg-haven-paa-papir
    title: Planlæg haven på papir
    excerpt: Før det første frø kommer i jorden, kan hele sæsonen ligge på ét ark ternet papir.
    category: dyrkning
    tags: [Planlægning, Frø]
    image: winter-plan
    author: Ida Holm
    days_ago: 120
    series: [fra-froe-til-middag, 1]
    # Earlier drafts, saved first so the article has a version history (the last saved text is `body`)
    revisions:
      - {excerpt: "Hele sæsonen på ét ark papir.", body: "Hver januar planlægger jeg haven. Mere følger."}
      - {excerpt: "Før det første frø kommer i jorden, ligger sæsonen på papir.", body: "Hver januar er haven frossen, og hver januar planlægger jeg den alligevel.\n\n## Ét ark, fire bede\n\nUdkast: tabellen mangler."}
    body: |
      Hver januar er haven frossen, og hver januar planlægger jeg den alligevel. Det er den billigste havedyrkning,
      der findes.

      ## Ét ark, fire bede

      Haven er ti gange fem meter. Jeg tegner den på ternet papir, én tern for tyve centimeter, og deler den i fire
      bede, der skifter hvert år:

      1. **Rodfrugter** – gulerødder, rødbeder, pastinak
      2. **Bælgplanter** – stangbønner, ærter, hestebønner
      3. **Kål** – grønkål, hvidkål, broccoli
      4. **Alt det andet** – squash, tomater, courgetter og det, jeg ikke kunne lade være med at bytte mig til

      > Sædskifte er ikke magi. Det forhindrer bare, at den samme sultne afgrøde står i den samme trætte jord.

      ## Hvad papiret skal bruges til

      Planen handler mindre om *hvor* end om *hvornår*. Ved hvert bed skriver jeg såugen og den uge, jeg regner
      med at høste, så jeg kan se, hvornår et bed bliver ledigt til en afgrøde mere.

      | Bed | Så | Høst | Bagefter |
      | --- | --- | --- | --- |
      | Rodfrugter | April | Juli – oktober | Grøngødning |
      | Bælgplanter | Maj | Juli – september | Porrer |
      | Kål | Juni (udplantning) | Oktober – marts | Hvile |
      | Alt det andet | Maj (udplantning) | Juli – september | Hvidløg |

      Næste indlæg handler om jorden, bedene står i.

  - slug: jorden-foerst
    title: Jorden først, planterne bagefter
    excerpt: To trillebøre kompost pr. bed, ingen gravning og langt mindre lugning, end jeg havde regnet med.
    category: dyrkning
    tags: [Jord, Kompost]
    image: soil
    author: Ida Holm
    days_ago: 104
    series: [fra-froe-til-middag, 2]
    body: |
      Jeg holdt op med at grave for tre år siden. Bedene får fem centimeter kompost hvert efterår, og
      regnormene klarer resten.

      ## Hvad der ændrede sig

      - Færre ukrudtsfrø spirer: de nedgravede bliver, hvor de er.
      - Fugtigere jord i juli: dækket holder solen væk.
      - Ondt i ryggen kun på kompostdagen, ikke hver weekend i foråret.

      ## Nok kompost

      Tre rum af paller: ét der fyldes, ét der omsættes, ét der er klar. Køkkenaffald, græs, pap og de blade,
      kommunen kører ud i november. At vende den er valgfrit; tålmodighed er ikke.

  - slug: saa-tomater-i-vindueskarmen
    title: Så tomater i vindueskarmen
    excerpt: Seks sorter, to bakker og ét meget solrigt køkkenvindue i marts.
    category: dyrkning
    tags: [Tomater, Frø]
    image: seedlings
    author: Ida Holm
    days_ago: 88
    series: [fra-froe-til-middag, 3]
    body: |
      Tomater har brug for et forspring, som vores forår ikke giver dem, så de sås indendørs i anden uge af marts.

      ## Sådan gør jeg

      1. Fyld en bakke med såjord, og vand nedefra.
      2. Så to frø pr. celle, fem millimeter dybt.
      3. Hold omkring 20 °C, til de spirer, og flyt dem så til det lyseste vindue, du har.
      4. Prikl dem om, når de første rigtige blade kommer, og begrav stænglen op til bladene.

      ## Årets sorter

      *Sungold* til at spise direkte fra planten, *Black Krim* til skiver, *San Marzano* til sauce og tre fra
      frøbyttedagen uden navn. En af dem bliver årets bedste tomat. Det gør den altid.

  - slug: hvad-goer-man-med-alle-de-tomater
    title: Hvad gør man med alle de tomater?
    excerpt: Ristet, henkogt, frosset og lavet til den eneste ketchup, vi ikke køber længere.
    category: madlavning
    tags: [Tomater, Supper]
    image: tomato-summer
    author: Jonas Berg
    days_ago: 40
    series: [fra-froe-til-middag, 4]
    layout:
      - type: full
        blocks:
          - type: text
            content: |
              I august holder haven op med at være en hobby og bliver et job. Ida kommer hjem med en kasse om dagen,
              og jeg har cirka en time til at gøre noget ved den. Det her er de fire ting, der virker.
      - type: two-column
        blocks:
          - type: text
            content: |
              ### Rist og frys

              Halvér, salt, olivenolie, hvidløg, 150 °C i to timer. Blend, køl af, frys fladt i poser. Pastasauce
              til vinteren på ti minutter.
          - type: image
            image: tomato-summer
            alt: En genereret illustration af røde bakker under en varm himmel
            caption: Ristede tomater tåler frost bedre end rå.
      - type: full
        blocks:
          - type: steps
            items:
              - {number: "1", title: Sortér, description: "Del kassen i perfekte, stødte og flækkede."}
              - {number: "2", title: Spis, description: "De perfekte kommer i salat i denne uge."}
              - {number: "3", title: Kog, description: "De stødte ristes samme aften."}
              - {number: "4", title: Gem, description: "De flækkede bliver til sauce eller ketchup."}
      - type: full
        blocks:
          - type: cards
            items:
              - {icon: "🍅", title: Passata, description: "Henkogt i vandbad, 40 minutter."}
              - {icon: "🥫", title: Ketchup, description: "Kogt ind i tre timer med æble og krydderier."}
              - {icon: "🍲", title: Suppe, description: "Med ristede peberfrugter, frosset i portioner."}
      - type: full
        blocks:
          - type: cta
            title: Vil du have opskriften på ketchup?
            description: Den står i serien om opbevaring, med de præcise mængder.
            buttonText: Læs serien
            buttonUrl: /series/et-aar-med-opbevaring

  - slug: stangboenner-op-ad-stokkene
    title: Stangbønner op ad stokkene
    excerpt: Et telt af hasselkæppe, tyve planter og flere bønner, end to mennesker kan spise.
    category: havedagbog
    tags: [Bønner]
    image: spring-beds
    author: Ida Holm
    days_ago: 70
    body: |
      Hasselkæppene kom op lørdag: otte pr. telt, bundet sammen i toppen med havesnor. To bønner ved foden af
      hver kæp, den svageste trækkes op senere.

      Stangbønner vil have vand mere end noget andet. En spand pr. telt, hver aften det ikke regner.

  - slug: squash-der-holder-til-marts
    title: Squash, der holder til marts
    excerpt: Butternut, Crown Prince og det tricks med modning, der får dem til at holde.
    category: dyrkning
    tags: [Squash, Vinter]
    image: autumn-store
    author: Ida Holm
    days_ago: 30
    body: |
      Squash er den afgrøde, der betaler huslejen om vinteren. Tre planter giver os omkring tyve frugter.

      ## Eftermodning

      Skær dem med en lang stilk, og lad dem ligge i solen (eller et varmt rum) i to uger, til skrællen er for hård
      til at lave mærker i med en negl. Den hærdede skræl er det, der holder dem friske i fem måneder.

      ## Opbevaring

      Køligt, tørt og uden at de rører hinanden. Vores ligger på en reol i gæsteværelset.

  - slug: hurtigsyltede-boenner
    title: Hurtigsyltede bønner på en weekend
    excerpt: En sødsur lage, dild fra haven og glas, der er klar efter tre dage.
    category: opbevaring
    tags: [Bønner, Syltning]
    image: jars
    author: Jonas Berg
    days_ago: 55
    series: [et-aar-med-opbevaring, 1]
    body: |
      Når stangbønnerne løber fra os, kommer de på glas.

      ## Lage

      - 500 ml æbleeddike
      - 500 ml vand
      - 2 spsk. salt, 3 spsk. sukker
      - dild, sennepsfrø og et fed hvidløg pr. glas

      Kog lagen op, hæld den over bønnerne, der står lodret i rene glas, luk og vend dem på hovedet i fem minutter.
      De er gode efter tre dage og holder sig to måneder i køleskabet.

  - slug: blommemarmelade-uden-pektin
    title: Blommemarmelade uden pektin
    excerpt: Naboens blommetræ, en bred gryde og rynkeprøven.
    category: opbevaring
    tags: [Marmelade]
    image: harvest-table
    author: Jonas Berg
    days_ago: 25
    series: [et-aar-med-opbevaring, 2]
    body: |
      Blommer har deres egen pektin, så marmeladen skal kun bruge frugt, sukker og en bred gryde.

      ## Forhold

      Et kilo udstenede blommer til 750 gram sukker. Kog kraftigt under omrøring, til en skefuld på en kold tallerken
      rynker, når du skubber til den. Det tager mellem ti og tyve minutter afhængigt af blommerne.

  - slug: vinterforraadet
    title: Vinterforrådet
    excerpt: Hvad vi gemmer, hvor længe det holder, og hvad vi dyrker mere af næste år.
    category: opbevaring
    tags: [Vinter, Planlægning]
    image: autumn-store
    author: Jonas Berg
    days_ago: 12
    series: [et-aar-med-opbevaring, 3]
    members_only: true
    body: |
      Her er hele opgørelsen over, hvad haven gav i år, og hvor længe hver del af det holdt.
      Medlemmer får også regnearket.

      ## Listen

      - 22 squash, den sidste spist i marts
      - 34 glas passata, 12 glas ketchup
      - 18 glas syltede bønner
      - 9 kilo løg, flettet og hængt op i skuret

      ## Næste år

      Flere løg, færre courgetter. Det er altid færre courgetter.

