  - slug: hvidloeg-i-oktober
    title: Hvidløg sættes i oktober
    excerpt: Fed for fed, spidsen op, og så glemmer man dem til juli.
    category: dyrkning
    tags: [Vinter]
    author: Ida Holm
    status: draft
    body: |
      Udkast. Hvidløg skal have kulde for at dele sig, så de sættes i oktober, fem centimeter dybt.

pages:
  - slug: om-os
    title: Om os
    image: harvest-table
    body: |
      **Nyttehaven** skrives af Ida, der dyrker have nr. 14, og Jonas, der laver mad af det.

      Vi startede den for at huske, hvad vi såede og hvornår. Det viste sig, at andre på ventelisten også ville vide
      det.

      ## Det finder du her

      - **Dyrkning**: hvordan vi planlægger, sår og passer haven
      - **Madlavning**: hvad vi laver den uge, kassen kommer hjem
      - **Opbevaring**: hvordan en sommers høst holder til foråret

      Log ind for at læse indlæg for medlemmer, som den fulde opgørelse over vinterforrådet.
